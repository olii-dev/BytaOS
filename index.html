<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BytaOS</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Moderustic:wght@400;700&display=swap" rel="stylesheet">
    <link rel="icon" href="icons/byta-logo.png">
</head>
<body>
    <!-- Menu Bar -->
    <div class="menu-bar">
        <img src="icons/byta-logo-black.png" alt="BytaOS Logo" class="menu-logo">
        <div class="menu-item">File</div>
        <div class="menu-item">Edit</div>
        <div class="menu-item">View</div>
        <div class="menu-item">Help</div>
    </div>

    <div class="desktop">
        <!-- Dock -->
        <div class="dock">
            <div class="dock-icons">
                <div class="dock-icon-container" data-name="Launcher">
                    <img src="icons/launcher.png" alt="Launcher" class="dock-icon">
                    <div class="launcher-status-dot status-dot"></div>
                </div>
                <div class="dock-icon-container" data-name="Terminal">
                    <img src="icons/apps/terminal.png" alt="Terminal" class="dock-icon">
                    <div class="terminal-status-dot status-dot"></div>
                </div>
                <div class="dock-icon-container" data-name="Notes">
                    <img src="icons/apps/notes.png" alt="Notes" class="dock-icon">
                    <div class="notes-status-dot status-dot"></div>
                </div>
                <div class="dock-icon-container" data-name="Files">
                    <img src="icons/apps/folder.png" alt="Files" class="dock-icon">
                    <div class="files-status-dot status-dot"></div>
                </div>
                <div class="dock-icon-container" data-name="Calendar">
                    <img src="icons/apps/calendar.svg" alt="Calendar" class="dock-icon">
                    <div class="calendar-status-dot status-dot"></div>
                </div>
                <div class="dock-icon-container" data-name="Settings">
                    <img src="icons/apps/settings.png" alt="Settings" class="dock-icon">
                    <div class="settings-status-dot status-dot"></div>
                </div>
            </div>
            <span class="app-name" id="app-name"></span>
            <div class="taskbar-clock-container">
                <div class="taskbar-clock">
                    <!-- Clock -->
                    <span id="clock"></span>
                </div>
            </div>
        </div>

        <!-- Desktop Icons -->
        <div class="desktop-icons">
            <div class="icon" onclick="openWindow('Bin')">
                <img src="icons/apps/bin.png" alt="Bin">
                <span>Bin</span>
            </div>
        </div>

        <!-- Terminal Window -->
        <div class="window" id="terminal-window">
            <div class="window-header">
                <span class="window-title">Terminal</span>
                <button class="close-button" onclick="closeWindow('Terminal')">&times;</button>
            </div>
            <div class="window-body">
                <div id="terminal-output"></div>
                <input type="text" id="terminal-input" onkeypress="handleTerminalInput(event)">
            </div>
        </div>

<!-- Notes Window -->
<div class="window" id="notes-window">
    <div class="window-header">
        <span class="window-title">Notes</span>
        <button class="close-button" onclick="closeWindow('Notes')">&times;</button>
    </div>
    <div class="window-body">
        <input type="text" id="note-title" placeholder="Title" class="notes-title-input">
        <input type="hidden" id="note-content-hidden">
        <div id="note-content" contenteditable="true" class="notes-content-input"></div>
        <input type="text" id="note-tags" placeholder="Tags (comma-separated)" class="notes-title-input">
        <div class="notes-actions">
            <button class="button-3d" onclick="formatText('bold')">Bold</button>
            <button class="button-3d" onclick="formatText('italic')">Italic</button>
            <button class="button-3d" onclick="formatText('underline')">Underline</button>
            <button class="button-3d" onclick="saveNote()">Save Note</button>
            <button class="button-3d" onclick="deleteNote()">Delete Note</button>
        </div>
        <input type="text" id="note-search" placeholder="Search notes..." class="notes-title-input">
        <ul id="notes-list"></ul>
    </div>
</div>

<!-- Launcher Window -->
<div class="launcher-window" id="launcher-window">
    <div class="launcher-header">
        <span class="window-title">Launcher</span>
        <button class="close-button" onclick="closeWindow('Launcher')">&times;</button>
    </div>
    <div class="launcher-body">
        <input type="text" id="search-bar" class="launcher-search" placeholder="Search apps...">
        <ul id="search-results" class="search-results"></ul>
    </div>
</div>

<!-- Files Window -->
<div class="window" id="files-window" style="display:none;">
    <div class="window-header">
        <span>Files</span>
        <button class="close-button" onclick="closeWindow('Files')">&times;</button>
    </div>
    <div class="window-body">
        <ul id="files-list" class="box"></ul>
    </div>
</div>

<!-- Calendar Window -->
<div class="window" id="calendar-window" style="display:none;">
    <div class="window-header">
        <span>Calendar</span>
        <button class="close-button" onclick="closeWindow('Calendar')">&times;</button>
    </div>
    <div class="window-body" id="calendar-body"></div>
</div>

<!-- Settings Window -->
<div class="window" id="settings-window" style="display:none;">
    <div class="window-header">
        <span>Settings</span>
        <button class="close-button" onclick="closeWindow('Settings')">&times;</button>
    </div>
    <div class="window-body">
        <!-- Theme Setting -->
        <div class="settings-option">
            <label for="theme-select">Theme:</label>
            <select class="button-3d" id="theme-select">
                <option value="light">Light</option>
                <option value="dark">Dark</option>
            </select>
        </div>
        <br>

        <!-- Clock Setting -->
        <div class="settings-option">
            <label for="clock-select">Clock:</label>
            <select class="button-3d" id="clock-select">
                <option value="12">12 Hour</option>
                <option value="24">24 Hour</option>
            </select>
        </div>
        <br>

                <!-- Save Settings Button -->
        <div class="settings-actions">
            <button class="button-3d save-button" onclick="saveSettings()">Save Settings</button>
        </div>

        <!-- About Section -->
        <div class="settings-option" style="display:flex;justify-content:center;align-items:center;">
            <p style="font-size:17px;margin:0;">© 2025 BytaOS</p>
        </div>
    </div>
</div>

<!-- Bin Window -->
<div class="window" id="bin-window" style="display:none;">
        <div class="window-header">
        <span>Bin</span>
        <button class="close-button" onclick="closeWindow('Bin')">&times;</button>
    </div>
    <div class="window-body">
        <ul id="bin-list"></ul>
    </div>
</div>

<!-- File Editor Modal -->
<div class="file-editor-modal" id="file-editor-modal">
    <div class="file-editor-content">
        <div class="file-editor-header">
            <span class="file-editor-title" id="editor-file-name">Untitled</span>
            <button class="close-button" onclick="closeFileEditor()">&times;</button>
        </div>
        <div class="file-editor-body">
            <textarea id="file-content-editor" placeholder="Enter file content..."></textarea>
        </div>
        <div class="file-editor-footer">
            <button class="button-3d" onclick="closeFileEditor()">Cancel</button>
            <button class="button-3d" onclick="saveFileContent()">Save</button>
        </div>
    </div>
</div>

    <script src="bytaos.js"></script>
</body>
</html>
